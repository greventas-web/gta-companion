<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Stylized diagram of Leonida</title>
  <desc id="mapDesc">Approximate diagram from official Rockstar footage. Mount Kalaga is on the northern border. Other positions are not surveyed.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141f"/>
      <stop offset="0.55" stop-color="#0a2433"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <radialGradient id="oceanGlow" cx="0.62" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#1a3a55" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#07141f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3b32"/>
      <stop offset="0.45" stop-color="#16352c"/>
      <stop offset="1" stop-color="#102820"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4a3c"/>
      <stop offset="1" stop-color="#1a3a30" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="city" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02060a" flood-opacity="0.45"/>
    </filter>
    <pattern id="marsh" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M2 20c6-10 10-10 14 0" fill="none" stroke="#7dcea0" stroke-opacity="0.28" stroke-width="1.2"/>
    </pattern>
    <pattern id="crops" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 16h18M4 2v12M12 4v10" fill="none" stroke="#c4b56a" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1600" fill="url(#ocean)"/>
  <rect width="1200" height="1600" fill="url(#oceanGlow)"/>

  <g fill="none" stroke="#9fd4e8" stroke-opacity="0.08" stroke-width="1">
    <path d="M80 220c80 20 140-10 220 16"/>
    <path d="M40 980c120 30 200 10 280 40"/>
    <path d="M860 1480c90-20 160 10 240-8"/>
  </g>

  <path filter="url(#soft)" fill="url(#land)" d="M420 120
    C560 50 860 55 1040 170
    C1180 270 1160 430 1100 580
    C1050 710 1140 820 1100 960
    C1060 1100 980 1200 880 1180
    C790 1165 800 1060 720 1020
    C630 970 560 1020 520 1120
    C470 1240 380 1280 280 1180
    C180 1080 140 940 190 800
    C230 680 160 540 250 400
    C320 280 300 170 420 120 Z"/>

  <path fill="url(#north)" d="M420 120
    C560 50 860 55 1040 170
    C1120 250 1140 360 1040 450
    C900 540 700 520 540 470
    C400 420 300 320 280 220
    C270 160 330 130 420 120 Z"/>

  <g fill="none" stroke="#d7efe4" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M470 210c70-50 150-46 230-10"/>
    <path d="M520 280c80-36 170-20 240 24"/>
    <path d="M430 340c90-20 200 0 280 40"/>
  </g>

  <ellipse cx="610" cy="520" rx="210" ry="120" fill="url(#crops)" opacity="0.9"/>
  <g fill="#c8c2b0" opacity="0.8">
    <rect x="520" y="440" width="16" height="46" rx="2"/>
    <rect x="542" y="422" width="12" height="64" rx="2"/>
    <rect x="560" y="448" width="14" height="38" rx="2"/>
  </g>

  <path d="M500 1600 L500 1160 C540 1060 640 1020 730 1080 C800 1130 820 1260 790 1600 Z" fill="#0a3144"/>
  <path d="M520 1500 C600 1420 760 1400 860 1480" fill="none" stroke="#8fd0ea" stroke-opacity="0.18" stroke-width="10"/>

  <path d="M210 980
    C270 950 350 1020 330 1110
    C310 1210 230 1240 180 1150
    C140 1060 150 1000 210 980 Z" fill="url(#marsh)"/>

  <ellipse cx="920" cy="1020" rx="190" ry="145" fill="url(#city)"/>
  <g fill="#ddd6fe" opacity="0.75">
    <rect x="860" y="940" width="10" height="28"/>
    <rect x="876" y="926" width="8" height="42"/>
    <rect x="890" y="948" width="12" height="22"/>
    <rect x="908" y="932" width="7" height="36"/>
    <rect x="922" y="950" width="11" height="20"/>
  </g>

  <g fill="#1f6a52">
    <ellipse cx="680" cy="1348" rx="78" ry="42"/>
    <ellipse cx="770" cy="1415" rx="96" ry="48"/>
    <ellipse cx="880" cy="1375" rx="54" ry="30"/>
    <ellipse cx="620" cy="1460" rx="36" ry="20"/>
  </g>
  <path d="M740 1368 C800 1300 880 1220 960 1145" fill="none" stroke="#d6dde8" stroke-width="7" stroke-linecap="round"/>
  <path d="M740 1368 C800 1300 880 1220 960 1145" fill="none" stroke="#8b93a7" stroke-width="2"/>

  <g fill="#e7e2ff" font-family="ui-sans-serif, system-ui, sans-serif">
    <g font-size="13" letter-spacing="3" fill="#c4b5fd">
      <polygon points="1122,90 1134,124 1122,116 1110,124" fill="#c4b5fd"/>
      <text x="1122" y="144" text-anchor="middle">N</text>
    </g>
    <text x="620" y="210" text-anchor="middle" font-size="28" font-weight="700">Mount Kalaga</text>
    <text x="620" y="236" text-anchor="middle" font-size="15" fill="#b7c4be">National Park · northern border</text>

    <text x="620" y="510" text-anchor="middle" font-size="28" font-weight="700">Ambrosia</text>
    <text x="620" y="536" text-anchor="middle" font-size="15" fill="#b7c4be">Heart of Leonida</text>

    <text x="320" y="730" text-anchor="middle" font-size="22" font-weight="700">Port Gellhorn</text>
    <text x="320" y="752" text-anchor="middle" font-size="13" fill="#b7c4be">Forgotten coast</text>

    <text x="280" y="1005" text-anchor="middle" font-size="22" font-weight="700">Grassrivers</text>
    <text x="280" y="1026" text-anchor="middle" font-size="13" fill="#b7c4be">Wetlands</text>

    <text x="940" y="990" text-anchor="middle" font-size="28" font-weight="700">Vice City</text>
    <text x="940" y="1014" text-anchor="middle" font-size="13" fill="#ddd6fe">Coastal metropolis</text>

    <text x="770" y="1455" text-anchor="middle" font-size="22" font-weight="700">Leonida Keys</text>
    <text x="770" y="1476" text-anchor="middle" font-size="13" fill="#b7c4be">Archipelago</text>
  </g>

  <text x="600" y="1564" text-anchor="middle" fill="#9fb0c0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
    Diagram from official Rockstar footage · positions approximate
  </text>
</svg>
